<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Électrique Wolf</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<style>
:root{--bg:#070d1a;--c:#0e1a2e;--c2:#15263f;--y:#fbbf24;--g:#22c55e;--r:#ef4444;--b:#3b82f6;--t:#e8eefc;--m:#8a9bb8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif}
#app{max-width:520px;margin:auto;padding:12px 12px 100px}h3{font-size:16px;margin:14px 0 8px}small{color:var(--m);font-size:11px}
.hero{border-radius:18px;padding:16px;min-height:200px;background-size:cover;background-position:left center;border:1px solid #1d2b44}
.hero h1{font-size:26px;color:var(--y);font-weight:900}.lg{width:70px;border-radius:50%}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--y)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.st,.box{background:var(--c);border:1px solid #1d2b44;border-radius:14px;padding:12px}
.card.sel{border:2px solid var(--y)}.card b{display:block;margin:4px 0}.row{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid #1d2b44}
.row>div{flex:1}.row b{display:block;font-size:14px}.row em{color:var(--y);font-style:normal;font-weight:700}.row i{font-style:normal;font-size:22px}
.cta{display:block;width:100%;background:var(--y);color:#000;font-weight:900;border:0;border-radius:30px;padding:13px;font:700 16px Cairo;margin-top:10px;text-align:center;text-decoration:none}
.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button,.chip{background:var(--c);color:var(--t);border:1px solid #1d2b44;border-radius:20px;padding:6px 14px;font:13px Cairo;white-space:nowrap}.tabs .on,.chip.on{background:var(--y);color:#000;font-weight:700}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st b{display:block;font-size:22px;margin:4px 0}.up{color:var(--g)}.dw{color:var(--r)}
.ch{width:100%;height:130px}.ax{display:flex;justify-content:space-between;color:var(--m);font-size:10px}.em{color:var(--m);text-align:center;padding:20px}
.dn{display:flex;align-items:center;gap:10px}.dn svg{width:120px}.dn>div{flex:1;font-size:12px}.lg2{display:grid;grid-template-columns:12px 1fr;gap:6px;margin-bottom:4px}.lg2 i{width:10px;height:10px;border-radius:50%;margin-top:6px}.lg2 small{grid-column:2}
nav{position:fixed;bottom:0;left:0;right:0;background:#0a1324;border-top:1px solid #1d2b44;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:0;border:0;color:var(--m);font:11px Cairo;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav .on{color:var(--y)}nav .pl span{background:var(--y);color:#000;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;margin-top:-22px;font-size:26px;font-weight:900}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tc{background:var(--c);border:1px solid #1d2b44;border-radius:14px;padding:8px;text-align:center}.tc img{width:100%;height:80px;object-fit:contain}.tc.lost{border-color:var(--r);background:#2a0f16}
.pill{display:inline-block;border-radius:20px;padding:2px 12px;font-size:12px;background:#0f3a2a;color:var(--g)}.lost .pill{background:#5b1620;color:#ff8a8a}.maint .pill{background:#3a2f0f;color:var(--y)}
input,select{width:100%;background:var(--c2);border:1px solid #1d2b44;color:var(--t);border-radius:10px;padding:10px;font:14px Cairo;margin-top:4px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:14px}.md{background:var(--c);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.md label{display:block;font-size:12px;color:var(--m);margin-top:8px}
.bt{display:flex;gap:8px;margin-top:14px}.bt button,.pri{flex:1;border:0;border-radius:10px;padding:10px;font:700 14px Cairo;background:var(--y);color:#000}.gh{background:var(--c2)!important;color:var(--t)!important}
#cv{height:340px;position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(#1b2b47,#0a1324);border:1px solid #1d2b44}#cv canvas{display:block}
.ctl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:2}.ctl button{width:38px;height:38px;border-radius:10px;border:1px solid #1d2b44;background:#0e1a2eee;color:var(--y);font:700 16px Cairo}
.lgd{position:absolute;top:8px;right:8px;background:#0e1a2ecc;border-radius:10px;padding:6px 10px;font-size:11px;z-index:2}.lgd i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:6px}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.tl div{background:var(--c);border:1px solid #1d2b44;border-radius:12px;padding:8px 2px;text-align:center;font-size:12px}.tl div.on{border:2px solid var(--y)}.tl span{font-size:24px;display:block}
.sr,.tt{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.tt{border-top:1px solid #1d2b44;margin-top:4px;font-weight:900;font-size:15px}.sr b{color:var(--y)}
#ts{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--y);color:#000;border-radius:20px;padding:8px 18px;font-weight:700;z-index:20;display:none}
.x{background:0;border:0;color:var(--r);font-size:18px}.ss{display:flex;gap:8px}.ss>*{flex:1}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(10px)}}.tc,.card,.row,.chip,nav button,.tl div{transition:transform .12s}.tc:active,.card:active,.row:active,.chip:active,nav button:active,.tl div:active{transform:scale(.94)}</style></head><body><div id="app"></div><nav id="nv"></nav><div id="ts"></div>

let th=.7,ph=.9,rad=9;const tg0=V(0,1,0);function cm(){cam.position.set(tg0.x+rad*Math.sin(ph)*Math.sin(th),tg0.y+rad*Math.cos(ph),tg0.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg0);rd.render(sc,cam)}
const rc=new THREE.Raycaster(),v2=new THREE.Vector2(),el=rd.domElement;el.style.touchAction='none';
function ray(cx,cy){const r=el.getBoundingClientRect();v2.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);rc.setFromCamera(v2,cam)}
const surf=()=>rc.intersectObjects(hit).filter(x=>x.object.userData.n.dot(rc.ray.direction)<0)[0];
function put(it,t,hs){const n=hs.object.userData.n,p=hs.point;it.t=t;if(t=='led'){it.x=Math.max(-W/2+.3,Math.min(W/2-.3,p.x));it.z=Math.max(-D/2+.3,Math.min(D/2-.3,p.z));it.y=H-.1;it.nx=0;it.ny=-1;it.nz=0;return 1}
if(n.y){toast('ضع هذا العنصر على الجدار');return 0}it.x=p.x+n.x*.05;it.z=p.z+n.z*.05;it.y=t=='panel'?1.5:Math.max(.3,Math.min(p.y,H-.3));it.nx=n.x;it.ny=0;it.nz=n.z;return 1}
function tap(cx,cy){ray(cx,cy);const hi=rc.intersectObjects(G.children.filter(m=>m.userData.i!==undefined))[0];if(hi){sel=hi.object.userData.i;vb(20);draw();upd();return}const hs=surf();if(!hs)return;const it={};if(put(it,cur,hs)){plan().push(it);sel=plan().length-1;vb(30);draw();upd();save()}}
const pts=new Map();let dn=null,pd=0,drag=false;
el.onpointerdown=e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId);if(pts.size==2){const a=[...pts.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);dn=null;return}dn={x:e.clientX,y:e.clientY,m:0};drag=false;if(sel!=null){ray(e.clientX,e.clientY);drag=!!rc.intersectObjects(G.children.filter(m=>m.userData.i===sel))[0]}};
el.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);rad=Math.max(4,Math.min(16,rad*pd/d));pd=d;cm();return}if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.m+=Math.abs(dx)+Math.abs(dy);dn.x=e.clientX;dn.y=e.clientY;
if(drag){if(dn.m>6){ray(e.clientX,e.clientY);const hs=surf();if(hs){put(plan()[sel],plan()[sel].t,hs);draw()}}}else{th-=dx*.01;ph=Math.max(.05,Math.min(1.5,ph-dy*.01));cm()}};
el.onpointerup=e=>{pts.delete(e.pointerId);if(dn&&!drag&&dn.m<6&&!pts.size)tap(e.clientX,e.clientY);if(drag&&dn&&dn.m>=6){save();upd()}dn=null;drag=false};
el.onpointercancel=e=>{pts.delete(e.pointerId);dn=null;drag=false};
el.onwheel=e=>{e.preventDefault();rad=Math.max(4,Math.min(16,rad+e.deltaY*.01));cm()};
V3={draw,zoom:d=>{rad=Math.max(4,Math.min(16,rad+d*1.5));cm()},mode:p=>{ph=p;cm()}};draw();upd()}
render();
